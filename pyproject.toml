[project]
name = "ga4-product-analytics"
version = "0.1.0"
description = "Funnel, retention, channel quality and experiment design on the GA4 BigQuery sample"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
# Only the one-off BigQuery pull needs these. Everything else runs offline.
extract = ["google-cloud-bigquery>=3.20", "pydata-google-auth>=1.8", "db-dtypes>=1.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
